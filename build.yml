name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Estrai lo zip
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Uso $ZIP"
          mkdir -p src_app
          unzip -q -o "$ZIP" -d src_app
          SETTINGS=$(find src_app -maxdepth 3 -name settings.gradle.kts | head -n 1)
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Compila
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JarvisWatt-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
